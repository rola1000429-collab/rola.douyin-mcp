[project]
name = "douyin-mcp"
version = "0.3.0"
description = "MCP server that lets AI browse, like, comment, publish and edit profile on Douyin via Playwright (local or cloud)"
requires-python = ">=3.10"
dependencies = ["mcp>=1.8.0,<2", "playwright>=1.44", "uvicorn>=0.30", "browserbase>=1.0"]

[project.scripts]
douyin-mcp = "server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]
